# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# One changelog for the whole repository; the commit scope names the part
# that changed (core, presentation, writing, poster, powerpoint, word,
# examples). Releases are tagged vX.Y.Z.
#
#   git cliff -o CHANGELOG.md            # rewrite the changelog
#   git cliff --unreleased               # preview what the next release holds
#   git cliff --bumped-version           # suggest the next version
#   git cliff -t vX.Y.Z -o CHANGELOG.md  # changelog for a release about to be tagged

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# Lets `--prepend` find and replace the header.
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/tree/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\

{% macro commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
{% endmacro -%}

{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::commit(commit=commit) }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in entry.commits %}
        {%- if not commit.scope -%}
            {{ self::commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
trim = true
render_always = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/johanvx/sci-propos" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
  # Link issue and pull request numbers.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
# The HTML comments fix the order of the sections; they are not shown.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { body = ".*security", group = "<!-- 7 -->Security" },
  { message = "^revert", group = "<!-- 8 -->Revert" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^release", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 9 -->Miscellaneous" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
ignore_tags = "rc|beta|alpha"
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "newest"

[bump]
# Before 1.0.0, a feature bumps the minor version and a fix the patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
